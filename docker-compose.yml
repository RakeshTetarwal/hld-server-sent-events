services:
  # ============================================================================
  # INFRASTRUCTURE
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: auction_postgres
    environment:
      POSTGRES_DB: auction_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "${PG_PORT:-5434}:5432"
    volumes:
      - pg_auction_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auction_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auction_redis
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - redis_auction_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: auction_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_HOST://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      - kafka_auction_data:/var/lib/kafka/data

  # ============================================================================
  # API GATEWAY (Reverse Proxy / Routing Entrypoint)
  # ============================================================================
  gateway:
    image: nginx:alpine
    container_name: auction_gateway
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auction_service
      - bidding_service

  # ============================================================================
  # MICROSERVICES (Clean Architecture / LLD)
  # ============================================================================
  auction_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.auction
    expose:
      - "8000"
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: postgres
      PG_PASSWORD: postgrespassword
      PG_DATABASE: auction_db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  bidding_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.bidding
    expose:
      - "8000"
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: postgres
      PG_PASSWORD: postgrespassword
      PG_DATABASE: auction_db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BID_TOPIC: auction.bids.incoming
    depends_on:
      - kafka
      - redis
      - postgres
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: postgres
      PG_PASSWORD: postgrespassword
      PG_DATABASE: auction_db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BID_TOPIC: auction.bids.incoming
      KAFKA_GROUP_ID: auction-bid-workers
    depends_on:
      - kafka
      - redis
      - postgres
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.scheduler
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: postgres
      PG_PASSWORD: postgrespassword
      PG_DATABASE: auction_db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - redis
      - postgres
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  pg_auction_data:
  redis_auction_data:
  kafka_auction_data:
