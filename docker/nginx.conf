events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    upstream auction_backend {
        server auction_service:8000;
    }

    upstream bidding_backend {
        server bidding_service:8000;
    }

    server {
        listen 80;

        # 1. Bidding Endpoints -> Bidding Service
        location ~ ^/auctions/[^/]+/bids {
            proxy_pass http://bidding_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Real-time SSE Stream -> Bidding Service (Streaming without buffering)
        location ~ ^/auctions/[^/]+/stream {
            proxy_pass http://bidding_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        # 3. Auction Management Endpoints -> Auction Service
        location /auctions {
            proxy_pass http://auction_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Healthcheck
        location /health {
            return 200 '{"status": "UP"}\n';
        }
    }
}
